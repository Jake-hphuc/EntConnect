<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EntConnect – Community Chat Room</title>
    <link href="/css/style.css" rel="stylesheet" />
    <link href="/css/chat-room.css" rel="stylesheet" />
    <!-- Bootstrap Icons for quick buttons and UI -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body>
    <div class="chat-room-container">
        <!-- Sidebar with channel list -->
        <aside class="chat-sidebar">
            <h5 class="p-3 mb-0 text-white">Kênh</h5>
            <ul class="channel-list list-unstyled">
                <li class="channel-item" data-channel="gaming">#gaming</li>
                <li class="channel-item" data-channel="karaoke">#karaoke</li>
                <li class="channel-item" data-channel="tìm-bạn">#tìm-bạn</li>
                <li class="channel-item" data-channel="ăn-uống">#ăn-uống</li>
            </ul>
        </aside>

        <!-- Main chat area -->
        <main class="chat-main">
            <header class="chat-header p-2 border-bottom border-white border-opacity-10 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 text-white" id="active-channel">#gaming</h5>
                <button class="btn btn-sm btn-link text-white p-0" id="close-chat"><i class="bi bi-x-lg"></i></button>
            </header>
            <section class="chat-messages" id="chat-messages"></section>
            <footer class="chat-input-bar p-2 border-top border-white border-opacity-10 d-flex align-items-center">
                <div class="quick-buttons d-flex gap-2 me-2">
                    <button class="btn btn-xs btn-outline-light rounded-pill px-2 py-1" data-prompt="Ai muốn chơi game không?">🎮</button>
                    <button class="btn btn-xs btn-outline-light rounded-pill px-2 py-1" data-prompt="Ai muốn karaoke không?">🎤</button>
                    <button class="btn btn-xs btn-outline-light rounded-pill px-2 py-1" data-prompt="Ai muốn cafe không?">☕</button>
                    <button class="btn btn-xs btn-outline-light rounded-pill px-2 py-1" data-prompt="Ai muốn tìm bạn mới?">🤝</button>
                </div>
                <input type="text" id="chat-input" class="form-control rounded-pill me-2" placeholder="Nhập tin nhắn..." autocomplete="off" maxlength="200" />
                <button class="btn btn-primary rounded-circle" id="chat-send"><i class="bi bi-send-fill"></i></button>
            </footer>
        </main>

        <!-- Optional user list panel on the right -->
        <aside class="chat-users" id="chat-users">
            <h5 class="p-3 mb-0 text-white">Thành viên</h5>
            <ul class="user-list list-unstyled" id="user-list"></ul>
        </aside>
    </div>

    <script src="/js/chat-room.js"></script>
</body>
</html>
