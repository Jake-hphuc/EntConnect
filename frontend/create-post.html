<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Bài - Chợ Kết Nối - EntConnect</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/css/marketplace.css">
</head>

<body class="bg-light">

    <!-- Navbar Minimal -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="/">
                <i class="bi bi-rocket-takeoff-fill text-primary me-2"></i>
                <span>Ent<span class="text-primary">Connect</span></span>
            </a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <a href="/marketplace.html" class="text-decoration-none text-muted fw-bold"><i class="bi bi-x-lg"></i> Hủy</a>
            </div>
        </div>
    </nav>

    <main style="padding-top: 100px; padding-bottom: 50px;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                        <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4">
                            <h3 class="fw-bold mb-3">Bạn muốn đăng gì hôm nay?</h3>
                            
                            <!-- Post Type Tabs -->
                            <div class="mp-form-tabs" id="postTypeTabs">
                                <button class="mp-form-tab active" data-type="event"><i class="bi bi-calendar-event me-2"></i>Sự kiện</button>
                                <button class="mp-form-tab" data-type="gaming"><i class="bi bi-controller me-2"></i>Teammate Game</button>
                                <button class="mp-form-tab" data-type="chat"><i class="bi bi-chat-heart me-2"></i>Thuê trò chuyện</button>
                                <button class="mp-form-tab" data-type="parttime"><i class="bi bi-briefcase me-2"></i>Công việc part-time</button>
                            </div>
                        </div>
                        
                        <div class="card-body p-4">
                            <form id="createPostForm">
                                <input type="hidden" id="postType" value="event">
                                
                                <div class="mb-4">
                                    <label class="form-label fw-bold">Tiêu đề bài đăng <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control form-control-lg bg-light border-0" id="postTitle" placeholder="Ví dụ: Tìm Dual Rank Kim Cương, Đi xem phim rạp..." required>
                                </div>
                                
                                <div class="row mb-4">
                                    <div class="col-md-6 mb-3 mb-md-0">
                                        <label class="form-label fw-bold">Danh mục <span class="text-danger">*</span></label>
                                        <select class="form-select bg-light border-0" id="postCategory" required>
                                            <option value="music">Âm nhạc / Acoustic</option>
                                            <option value="gaming">Gaming</option>
                                            <option value="movies">Phim ảnh</option>
                                            <option value="sports">Thể thao</option>
                                            <option value="travel">Du lịch</option>
                                            <option value="chat">Trò chuyện / Tâm sự</option>
                                            <option value="other">Khác</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Hình thức <span class="text-danger">*</span></label>
                                        <select class="form-select bg-light border-0" id="postMode" required>
                                            <option value="offline">Offline (Gặp mặt trực tiếp)</option>
                                            <option value="online">Online (Trực tuyến)</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <div class="mb-4">
                                    <label class="form-label fw-bold">Ảnh Thumbnail / Cover</label>
                                    <div class="border border-dashed rounded-4 p-4 text-center bg-light" style="border-width: 2px !important; border-color: #d1d5db !important;">
                                        <i class="bi bi-cloud-arrow-up fs-1 text-muted"></i>
                                        <p class="text-muted mb-1 mt-2">Kéo thả ảnh vào đây hoặc click để chọn file</p>
                                        <input type="file" class="d-none" id="postImage" accept="image/*">
                                        <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill mt-2" onclick="document.getElementById('postImage').click()">Chọn ảnh</button>
                                        <div id="imagePreview" class="mt-3 d-none">
                                            <img src="" alt="preview" class="img-fluid rounded" style="max-height: 200px;">
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="mb-4">
                                    <label class="form-label fw-bold">Mô tả chi tiết <span class="text-danger">*</span></label>
                                    <textarea class="form-control bg-light border-0" id="postDesc" rows="5" placeholder="Mô tả cụ thể về yêu cầu, nội dung sự kiện, công việc..." required></textarea>
                                </div>
                                
                                <div class="row mb-4">
                                    <div class="col-md-6 mb-3 mb-md-0">
                                        <label class="form-label fw-bold">Thời gian <span class="text-danger">*</span></label>
                                        <input type="datetime-local" class="form-control bg-light border-0" id="postTime" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Địa điểm <span class="text-muted fw-normal">(Để trống nếu Online)</span></label>
                                        <input type="text" class="form-control bg-light border-0" id="postLocation" placeholder="Ví dụ: Quận 1, TP.HCM hoặc Discord">
                                    </div>
                                </div>
                                
                                <div class="row mb-4">
                                    <div class="col-md-4 mb-3 mb-md-0">
                                        <label class="form-label fw-bold">Số lượng người cần <span class="text-danger">*</span></label>
                                        <input type="number" class="form-control bg-light border-0" id="postSlots" min="1" value="1" required>
                                    </div>
                                    <div class="col-md-4 mb-3 mb-md-0">
                                        <label class="form-label fw-bold">Mức giá / Chi phí <span class="text-danger">*</span></label>
                                        <input type="number" class="form-control bg-light border-0" id="postPrice" min="0" step="10000" placeholder="0 nếu miễn phí" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-bold">Đơn vị tính</label>
                                        <select class="form-select bg-light border-0" id="postPriceUnit">
                                            <option value="buổi">Theo buổi/lần</option>
                                            <option value="giờ">Theo giờ</option>
                                            <option value="ngày">Theo ngày</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <hr class="my-4 opacity-10">
                                <h5 class="fw-bold mb-3">Yêu cầu thêm (Tùy chọn)</h5>
                                
                                <div class="row mb-4">
                                    <div class="col-md-6 mb-3 mb-md-0">
                                        <label class="form-label fw-bold">Giới tính mong muốn</label>
                                        <select class="form-select bg-light border-0" id="postGender">
                                            <option value="any">Bất kỳ</option>
                                            <option value="male">Nam</option>
                                            <option value="female">Nữ</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Độ tuổi mong muốn</label>
                                        <input type="text" class="form-control bg-light border-0" id="postAge" placeholder="Ví dụ: 18-25, > 20...">
                                    </div>
                                </div>
                                
                                <div class="mb-4">
                                    <label class="form-label fw-bold">Thẻ Tag (Tags)</label>
                                    <input type="text" class="form-control bg-light border-0" id="postTags" placeholder="Cách nhau bằng dấu phẩy (Ví dụ: LOL, Rank, Vui vẻ)">
                                </div>
                                
                                <div class="d-grid mt-5">
                                    <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold shadow-sm">Đăng Bài Ngay</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div class="mp-toast-container" id="mpToastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/create-post.js"></script>
</body>
</html>
