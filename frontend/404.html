<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Không tìm thấy - EntConnect</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/style.css">
</head>

<body class="bg-body d-flex align-items-center justify-content-center min-vh-100 overflow-hidden">

    <div class="container text-center reveal-on-scroll active">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- Glitch Text Effect -->
                <h1 class="display-1 fw-black text-primary mb-0 font-outfit" style="font-size: 8rem; line-height: 1; position: relative;">
                    404
                </h1>
                
                <h2 class="fw-bold mb-4 mt-3">Ối! Bạn đi lạc rồi.</h2>
                <p class="text-muted mb-5 fs-5">
                    Trang bạn đang tìm kiếm có thể đã bị xóa, đổi tên hoặc tạm thời không thể truy cập.
                    Hãy quay lại để khám phá những sự kiện thú vị khác nhé!
                </p>
                
                <div class="d-flex gap-3 justify-content-center flex-column flex-sm-row">
                    <button onclick="window.history.back()" class="btn bg-white border rounded-pill px-5 py-3 fw-bold shadow-sm hover-border-primary hover-text-primary">
                        <i class="bi bi-arrow-left me-2"></i>Quay lại
                    </button>
                    <a href="/" class="btn btn-primary rounded-pill px-5 py-3 fw-bold shadow-premium">
                        <i class="bi bi-house-door me-2"></i>Về trang chủ
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Floating Elements Background -->
        <div class="position-absolute top-0 left-0 w-100 h-100" style="z-index: -1; pointer-events: none; overflow: hidden;">
            <div class="position-absolute" style="top: 20%; left: 10%; animation: float-gradient 12s ease-in-out infinite alternate; filter: blur(50px); width: 300px; height: 300px; background: rgba(99, 102, 241, 0.15); border-radius: 50%;"></div>
            <div class="position-absolute" style="bottom: 20%; right: 10%; animation: float-gradient 15s ease-in-out infinite alternate-reverse; filter: blur(50px); width: 400px; height: 400px; background: rgba(236, 72, 153, 0.1); border-radius: 50%;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/ui.js"></script>
</body>

</html>
